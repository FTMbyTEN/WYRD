<!doctype html>
<!-- WYRD world map: loaded by src/components/WorldMap.tsx (iframe on web, WebView on phones).
     A real page, not inline HTML: MapLibre drops worker replies from a mismatched origin,
     which is what an inline srcdoc/HTML-string page gets, so tiles would never load. -->
<html><head>
<title>WYRD world map</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<style>
  html,body,#map{margin:0;height:100%;background:#f2f2f0}
  .maplibregl-ctrl-group{border-radius:0!important;box-shadow:none!important;border:1px solid #000}
  .maplibregl-ctrl-scale{border-color:#000;color:#000;font:10px monospace;background:rgba(255,255,255,.8)}
  .maplibregl-ctrl-attrib{font:9px monospace}
  .maplibregl-popup-content{border-radius:0;border:1px solid #000;font:12px monospace;padding:6px 9px;box-shadow:none}
  .maplibregl-popup-tip{display:none}
</style></head><body><div id="map"></div><script>
  var post = function (m) {
    var s = JSON.stringify(m);
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(s); else parent.postMessage(s, '*');
  };
  var START_STYLE = "https://tiles.openfreemap.org/styles/positron";
  var countries = { type: 'FeatureCollection', features: [] };
  var focused = null;

  function dotLayers() {
    var isFocused = ['==', ['get', 'cca3'], focused || ''];
    return [
      { id: 'wyrd-dot-halo', type: 'circle', source: 'wyrd-countries', filter: isFocused,
        paint: { 'circle-radius': 14, 'circle-color': '#000', 'circle-opacity': 0.12, 'circle-stroke-width': 1.5, 'circle-stroke-color': '#000' } },
      { id: 'wyrd-dot', type: 'circle', source: 'wyrd-countries',
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 1, 2.5, 5, 5],
          'circle-color': ['case', isFocused, '#000', '#fff'],
          'circle-stroke-color': '#000', 'circle-stroke-width': 1.3,
          'circle-opacity': ['interpolate', ['linear'], ['zoom'], 6, 1, 8, 0],
          'circle-stroke-opacity': ['interpolate', ['linear'], ['zoom'], 6, 1, 8, 0]
        } }
    ];
  }

  // Every style (the first one and each switch) is loaded through here, so the country markers
  // and flat buildings are part of the style itself rather than patched on after a load event.
  function withWyrd(prev, next) {
    var sources = Object.assign({}, next.sources, { 'wyrd-countries': { type: 'geojson', data: countries } });
    var layers = next.layers.map(function (l) {
      if (l.type !== 'fill-extrusion') return l;
      // flat by design: 3D building blocks become plain footprints
      return Object.assign({}, l, { paint: Object.assign({}, l.paint, { 'fill-extrusion-height': 0, 'fill-extrusion-base': 0 }) });
    });
    return Object.assign({}, next, { sources: sources, layers: layers.concat(dotLayers()) });
  }

  var map = new maplibregl.Map({
    container: 'map', style: { version: 8, sources: {}, layers: [] }, center: [10, 25], zoom: 1.6,
    minZoom: 1, maxZoom: 19, dragRotate: false, pitchWithRotate: false, touchPitch: false,
    renderWorldCopies: true, attributionControl: { compact: true }
  });
  map.__style = START_STYLE; // only a change of style reloads
  map.setStyle(START_STYLE, { transformStyle: withWyrd });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric', maxWidth: 110 }), 'bottom-left');

  function setFocused(code) {
    focused = code;
    if (!map.getLayer('wyrd-dot')) return;
    var isFocused = ['==', ['get', 'cca3'], code || ''];
    map.setFilter('wyrd-dot-halo', isFocused);
    map.setPaintProperty('wyrd-dot', 'circle-color', ['case', isFocused, '#000', '#fff']);
  }

  map.on('click', 'wyrd-dot', function (e) { var f = e.features && e.features[0]; if (f) post({ type: 'select', cca3: f.properties.cca3 }); });
  map.on('mouseenter', 'wyrd-dot', function () { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'wyrd-dot', function () { map.getCanvas().style.cursor = ''; });
  var popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
  map.on('mousemove', 'wyrd-dot', function (e) { var f = e.features[0]; popup.setLngLat(f.geometry.coordinates).setText(f.properties.name).addTo(map); });
  map.on('mouseleave', 'wyrd-dot', function () { popup.remove(); });
  var report = function () { var c = map.getCenter(); post({ type: 'view', lat: c.lat, lng: c.lng, zoom: map.getZoom() }); };
  map.on('moveend', report);
  map.once('load', function () { report(); post({ type: 'ready' }); });

  window.__wyrd = function (m) {
    if (m.type === 'countries') {
      countries = { type: 'FeatureCollection', features: m.countries.map(function (c) {
        return { type: 'Feature', geometry: { type: 'Point', coordinates: [c.lng, c.lat] }, properties: { name: c.name, cca3: c.cca3 } };
      }) };
      var s = map.getSource('wyrd-countries'); if (s) s.setData(countries);
    } else if (m.type === 'focus') {
      setFocused(m.cca3);
      map.flyTo({ center: [m.lng, m.lat], zoom: Math.max(map.getZoom(), 4.2), speed: 1.4, essential: true });
    } else if (m.type === 'style') {
      if (map.__style !== m.url) { map.__style = m.url; map.setStyle(m.url, { transformStyle: withWyrd }); }
    }
  };
  window.addEventListener('message', function (e) { try { window.__wyrd(typeof e.data === 'string' ? JSON.parse(e.data) : e.data); } catch (_) {} });
</script></body></html>
